name: "Update Recent Repos"
on:
  schedule:
    # Roda todo dia à meia-noite
    - cron: '0 0 * * *' 
    # Permite rodar manualmente
    #workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/github-readme-recent-repos@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sort: "updated"
          limit: 5
